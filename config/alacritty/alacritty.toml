# Amber — Alacritty 0.17 / KDE Plasma Wayland
# Independent of Crylia. Palette is generated from shell/theme/palettes.json.
# Initial values and ergonomics retained from the working Crylia setup.

[general]
import = ["~/Rice/amber/config/alacritty/amber-colors.toml"]
live_config_reload = true
ipc_socket = true

[window]
decorations = "Full"
opacity = 0.90
blur = true
padding = { x = 12, y = 10 }
dynamic_padding = false
startup_mode = "Windowed"

[scrolling]
history = 10000
multiplier = 3

[font]
size = 12
builtin_box_drawing = true
normal = { family = "JetBrainsMono Nerd Font Mono", style = "Regular" }
bold = { family = "JetBrainsMono Nerd Font Mono", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font Mono", style = "Italic" }
bold_italic = { family = "JetBrainsMono Nerd Font Mono", style = "Bold Italic" }
offset = { x = 0, y = 1 }
glyph_offset = { x = 0, y = 0 }

[cursor]
style = { shape = "Block", blinking = "On" }
vi_mode_style = { shape = "Block", blinking = "Off" }
blink_interval = 650
blink_timeout = 5
unfocused_hollow = true

[selection]
save_to_clipboard = true

[mouse]
hide_when_typing = true
